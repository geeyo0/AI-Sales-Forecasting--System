<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Business Account</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">

        <!-- Shared light and dark theme -->
        <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
        
        <script src="{{ url_for('theme_script') }}"></script>
        </head>

<body>
    <main class="account-page">
        <a href="{{ url_for('admin_dashboard') }}">
            Back to dashboard
        </a>

        <section class="card account-card">
            <h1>Add Business Account</h1>

            <p class="admin-description">
                Enter the business details and create its login account.
            </p>

            {% if error %}
            <p class="account-error" role="alert">
                {{ error }}
            </p>
            {% endif %}

            <form method="post" action="{{ url_for('add_business') }}" class="account-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="field">
                    <label for="business_name">Business Name</label>

                    <input type="text" id="business_name" name="business_name" value="{{ values['business_name'] }}"
                        maxlength="100" required>
                </div>

                <div class="field">
                    <label for="business_type">Business Type</label>

                    <select id="business_type" name="business_type" required>
                        <option value="">Select a business type</option>

                        {% for business_type in
                        ['Bakery', 'Carinderia', 'Food Stall'] %}
                        <option value="{{ business_type }}" {% if values['business_type']==business_type %} selected {%
                            endif %}>
                            {{ business_type }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field">
                    <label for="username">Username</label>

                    <input type="text" id="username" name="username" value="{{ values['username'] }}" maxlength="50"
                        autocomplete="off" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" minlength="12" autocomplete="new-password"
                        aria-describedby="password-help" required>

                    <p id="password-help" class="account-help">
                        Use at least 12 characters.
                    </p>
                </div>

                <div class="field">
                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input type="password" id="confirm_password" name="confirm_password" minlength="12"
                        autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Create Business Account
                </button>
            </form>
        </section>
    </main>
</body>

</html>
