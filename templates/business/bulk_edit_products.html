<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Selected Products | FoodCast</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='business.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='product_tools.css') }}">

    <script src="{{ url_for('theme_script') }}"></script>
</head>

<body>
    <main class="sales-edit-page">
        <a class="btn btn-outline" href="{{ url_for('business_products') }}">
            Back to products
        </a>

        <section class="card bulk-products-card">
            <h1 class="business-page-title">
                Edit Selected Products
            </h1>

            <p class="sales-description">
                Update the {{ products|length }} selected products.
            </p>

            {% if error %}
            <p class="business-error" role="alert">
                {{ error }}
            </p>
            {% endif %}

            <form method="post" class="product-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                {% for product in products %}
                <input type="hidden" name="product_id" value="{{ product['product_id'] }}">

                <section class="card bulk-product-edit-row">
                    <div class="tools-heading">
                        <div>
                            <h2 class="section-title">
                                {{ product["product_name"] }}
                            </h2>

                            <p class="sales-description">
                                Sold by {{ product["selling_unit"] }}
                            </p>
                        </div>
                    </div>

                    <div class="bulk-product-edit-fields">
                        <div class="field">
                            <label for="product_name_{{ product['product_id'] }}">
                                Product Name
                            </label>

                            <input type="text" id="product_name_{{ product['product_id'] }}"
                                name="product_name_{{ product['product_id'] }}"
                                value="{{ values[product['product_id']]['product_name'] }}" maxlength="100" required>
                        </div>

                        <div class="field">
                            <label for="category_{{ product['product_id'] }}">
                                Category
                            </label>

                            <select id="category_{{ product['product_id'] }}"
                                name="category_{{ product['product_id'] }}" required>
                                {% for category in categories %}
                                <option value="{{ category }}" {% if values[product['product_id']]['category']==category
                                    %} selected {% endif %}>
                                    {{ category }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="field">
                            <label for="selling_price_{{ product['product_id'] }}">
                                Selling Price (₱)
                            </label>

                            <input type="number" id="selling_price_{{ product['product_id'] }}"
                                name="selling_price_{{ product['product_id'] }}"
                                value="{{ values[product['product_id']]['selling_price'] }}" min="0" max="99999999.99"
                                step="0.01" required>
                        </div>
                    </div>
                </section>
                {% endfor %}

                <div class="tools-buttons">
                    <a class="btn btn-outline" href="{{ url_for('business_products') }}">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Save All Changes
                    </button>
                </div>
            </form>
        </section>
    </main>

    <style>
        .sales-edit-page {
            width: min(1180px, calc(100% - 40px));
            margin: 28px auto;
        }
    
        .bulk-products-card {
            width: 100%;
            max-width: none;
            margin-top: 18px;
            padding: 28px;
            box-sizing: border-box;
        }
    
        .bulk-product-edit-row {
            width: 100%;
            margin-top: 18px;
            padding: 24px;
            box-sizing: border-box;
        }
    
        .bulk-product-edit-fields {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            width: 100%;
        }
    
        .bulk-product-edit-fields .field {
            min-width: 0;
            width: 100%;
        }
    
        .bulk-product-edit-fields input,
        .bulk-product-edit-fields select {
            display: block;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            min-height: 48px;
            padding: 10px 14px;
            box-sizing: border-box;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            font: inherit;
        }
    
        .bulk-products-card .tools-buttons {
            width: 100%;
            box-sizing: border-box;
        }
    
        @media (max-width: 850px) {
            .bulk-product-edit-fields {
                grid-template-columns: 1fr 1fr;
            }
    
            .bulk-product-edit-fields .field:first-child {
                grid-column: 1 / -1;
            }
        }
    
        @media (max-width: 600px) {
            .sales-edit-page {
                width: min(100% - 20px, 1180px);
                margin: 16px auto;
            }
    
            .bulk-products-card {
                padding: 18px;
            }
    
            .bulk-product-edit-row {
                padding: 16px;
            }
    
            .bulk-product-edit-fields {
                grid-template-columns: 1fr;
            }
    
            .bulk-product-edit-fields .field:first-child {
                grid-column: auto;
            }
        }
    </style>
</body>

</html>
