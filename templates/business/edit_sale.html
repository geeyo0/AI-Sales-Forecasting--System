<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Sales Record</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='business.css') }}">

        <!-- Shared light and dark theme -->
        <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
        
        <script src="{{ url_for('theme_script') }}"></script>
        </head>

<body>
    <main class="sales-edit-page">

        <a href="{{ url_for('business_sales') }}">
            Back to sales
        </a>

        <section class="card sales-edit-card">
            <h1 class="business-page-title">Edit Sales Record</h1>

            <p class="sales-description">
                {{ sale["product_name"] }}
                — {{ sale["selling_unit"] }}
            </p>

            {% if error %}
            <p class="business-error" role="alert">
                {{ error }}
            </p>
            {% endif %}

            <form method="post" action="{{ url_for('edit_sale', sale_id=sale['sale_id']) }}" class="product-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="field">
                    <label for="sale_date">Sales Date</label>

                    <input type="date" id="sale_date" name="sale_date" value="{{ values['sale_date'] }}"
                        max="{{ today }}" required>
                </div>

                <div class="field">
                    <label for="quantity_sold">Quantity Sold</label>

                    <input type="number" id="quantity_sold" name="quantity_sold" value="{{ values['quantity_sold'] }}"
                        min="0" max="2147483647" step="1" required>
                </div>

                <div class="field">
                    <label for="sales_amount">
                        Actual Sales Amount (₱)
                    </label>

                    <input type="number" id="sales_amount" name="sales_amount" value="{{ values['sales_amount'] }}"
                        min="0" max="9999999999.99" step="0.01" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>
            </form>
        </section>

    </main>
</body>

</html>
