<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create new password | FoodCast</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>

<body class="registration-page">
    <main class="registration-card verification-card">
        <header class="registration-heading">
            <img class="registration-main-logo" src="{{ url_for('static', filename='images/logo.png') }}"
                alt="FoodCast logo">

            <h1>Create a new password</h1>
            <p>Choose a strong password for your FoodCast account.</p>
        </header>

        {% if error %}
        <p class="registration-error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" class="registration-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="registration-field">
                <label for="password">New password</label>
                <input type="password" id="password" name="password" minlength="12" autocomplete="new-password"
                    required>
            </div>

            <div class="registration-field">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="12"
                    autocomplete="new-password" required>
            </div>

            <p class="registration-help">
                Use at least 12 characters with an uppercase letter,
                lowercase letter, number, and symbol.
            </p>

            <button type="submit" class="registration-submit">
                Change password
            </button>
        </form>
    </main>
</body>

</html>
