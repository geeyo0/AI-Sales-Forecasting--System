<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password | FoodCast</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>

<body class="registration-page">
    <main class="registration-card verification-card">
        <a class="registration-back" href="{{ url_for('login') }}">
            ← Back to sign in
        </a>

        <header class="registration-heading">
            <img class="registration-main-logo" src="{{ url_for('static', filename='images/logo.png') }}"
                alt="FoodCast logo">

            <h1>Forgot your password?</h1>
            <p>Enter the username and email address for your account.</p>
        </header>

        {% if error %}
        <p class="registration-error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" class="registration-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="registration-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ values.username }}" required>
            </div>

            <div class="registration-field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" value="{{ values.email }}" required>
            </div>

            <button type="submit" class="registration-submit">
                Send reset code
            </button>
        </form>
    </main>
</body>

</html>
